<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện Sinh vật - Fantasy Codex</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="GiaoDien.css">
    <link rel="stylesheet" href="creatures.css">
</head>
<body class="dark-mode">

<nav class="navbar">
    <div class="nav-left">
        <button class="menu-btn" onclick="window.history.back()">
            <i class="fa fa-arrow-left"></i>
        </button>
        <div class="logo"><i class="fa-solid fa-dragon"></i> <span>Creature Codex</span></div>
    </div>
    <div class="nav-right">
        <button class="icon-btn" onclick="exportCreatures()" title="Xuất JSON"><i class="fa fa-download"></i></button>
        <label class="icon-btn" title="Nhập JSON">
            <i class="fa fa-upload"></i>
            <input type="file" id="creatureImportFile" accept=".json" hidden onchange="importCreatures(event)">
        </label>
    </div>
</nav>

<main class="content" style="padding-top: 80px;">
    <header class="section-header" style="text-align: center; margin-bottom: 30px;">
        <h2 class="cinzel-font" style="color: var(--gold); font-size: 2.5rem; text-shadow: var(--shadow-glow);">Thư viện Sinh vật</h2>
        <p style="color: var(--text-dim);">Khám phá và quản lý các loài quái thú trong thế giới của bạn</p>
    </header>

    <div class="toolbar" style="display: flex; gap: 15px; margin-bottom: 30px; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div class="search-filter-group" style="display:flex; flex:1; min-width:300px; gap:10px;">
            <div class="search-box" style="flex: 1; position: relative;">
                <i class="fa fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gold);"></i>
                <input type="text" id="creatureSearch" placeholder="Tìm kiếm tên..." 
                       style="width: 100%; padding: 12px 12px 12px 45px; background: var(--glass); border: 1px solid var(--border); border-radius: 12px; color: white;">
            </div>
            <select id="creatureFilterRank" style="background:var(--glass); border:1px solid var(--border); border-radius:12px; color:white; padding:0 15px; outline:none; max-width:130px;">
                <option value="">Tất cả</option>
                <option value="S">Rank S</option>
                <option value="A">Rank A</option>
                <option value="B">Rank B</option>
                <option value="C">Rank C</option>
            </select>
        </div>
        <button class="btn-back-modern" onclick="openCreatureModal()" style="background: var(--gold); color: #000;">
            <i class="fa fa-plus"></i> Thêm Sinh Vật
        </button>
    </div>

    <div id="creatureList" class="grid-container">
        </div>

    <div id="creaturePagination" class="pagination-container" style="margin-top: 40px;"></div>
</main>

<div id="creatureModal" class="modal">
    <div class="modal-content glass-effect" style="max-width: 600px; border: 1px solid var(--gold);">
        <div class="modal-header">
            <h3 class="cinzel-font"><i class="fa-solid fa-scroll"></i> Hồ sơ Sinh vật</h3>
            <span class="close" onclick="closeCreatureModal()">&times;</span>
        </div>
        
        <div class="form-tabs">
            <button type="button" class="tab-btn active" onclick="switchCreatureTab(event, 'tabBasic')">Cơ bản</button>
            <button type="button" class="tab-btn" onclick="switchCreatureTab(event, 'tabTraits')">Đặc tính</button>
            <button type="button" class="tab-btn" onclick="switchCreatureTab(event, 'tabStats')">Chỉ số</button>
        </div>

        <form id="creatureForm" onsubmit="event.preventDefault(); saveCreature();">
            
            <!-- TAB 1: CƠ BẢN -->
            <div id="tabBasic" class="tab-content">
                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Tên sinh vật <span style="color:red">*</span></label>
                        <input type="text" id="creatureName" required placeholder="Ví dụ: Rồng Lửa Thượng Cổ">
                    </div>
                    <div class="form-group">
                        <label>Phân loại</label>
                        <input type="text" id="creatureType" placeholder="Ví dụ: Thần thú, Quỷ...">
                    </div>
                    <div class="form-group">
                        <label>Độ nguy hiểm (Rank)</label>
                        <select id="creatureRank">
                            <option value="S">Rank S</option>
                            <option value="A">Rank A</option>
                            <option value="B">Rank B</option>
                            <option value="C">Rank C</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 15px;">
                    <label>Hình ảnh</label>
                    <div class="upload-zone" onclick="document.getElementById('creatureImg').click()" 
                         style="border: 2px dashed var(--border); padding: 20px; text-align: center; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                        <i class="fa fa-cloud-upload" style="font-size: 2rem; color: var(--gold);"></i>
                        <p style="margin: 5px 0 0 0; font-size: 0.9rem;">Nhấn để tải ảnh</p>
                        <input type="file" id="creatureImg" accept="image/*" hidden onchange="previewCreatureImage(event)">
                    </div>
                    <img id="creaturePreview" class="hidden" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid var(--gold);">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label>Mô tả đặc điểm</label>
                    <textarea id="creatureDesc" rows="3" placeholder="Viết về tập tính, kỹ năng..."></textarea>
                </div>
            </div>

            <!-- TAB 2: ĐẶC TÍNH -->
            <div id="tabTraits" class="tab-content hidden">
                <div class="form-group">
                    <label>Vùng sinh sống</label>
                    <input type="text" id="creatureHabitat" placeholder="Vực thẳm, Rừng sương mù...">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Nhược điểm</label>
                    <input type="text" id="creatureWeakness" placeholder="Sợ lửa, Mắt trái...">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Vật phẩm rơi (Drops)</label>
                    <input type="text" id="creatureDrops" placeholder="Vảy rồng, Nanh quỷ...">
                </div>

                <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.2);">
                    <div class="form-group" style="grid-column: span 2;">
                        <label><i class="fa-solid fa-fire"></i> Kỹ năng Độc Tôn</label>
                        <input type="text" id="creatureSkill" placeholder="VD: Hơi Thở Rồng Lửa...">
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-horse-head"></i> Thuần hóa</label>
                        <select id="creatureTameable">
                            <option value="false">Không thể</option>
                            <option value="true">Có thể</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fa-solid fa-dna"></i> Dạng Tiến Hóa</label>
                        <select id="creatureEvolution">
                            <option value="">-- Không có --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- TAB 3: CHỈ SỐ -->
            <div id="tabStats" class="tab-content hidden">
                <div class="form-group" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,0,0,0.2);">
                    <label style="color: #ef4444; margin-bottom: 10px; display: block;"><i class="fa-solid fa-chart-simple"></i> Chỉ Số Chiến Đấu</label>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                        <div>
                            <label style="font-size: 0.75rem; color:#f87171;">HP (Máu) max 500</label>
                            <input type="number" id="statHP" value="100" min="1" max="500" style="border-color:#f87171;">
                        </div>
                        <div>
                            <label style="font-size: 0.75rem; color:#fb923c;">ATK (Công) max 300</label>
                            <input type="number" id="statATK" value="50" min="1" max="300" style="border-color:#fb923c;">
                        </div>
                        <div>
                            <label style="font-size: 0.75rem; color:#60a5fa;">DEF (Thủ) max 300</label>
                            <input type="number" id="statDEF" value="50" min="1" max="300" style="border-color:#60a5fa;">
                        </div>
                        <div>
                            <label style="font-size: 0.75rem; color:#34d399;">SPD (Tốc độ) max 300</label>
                            <input type="number" id="statSPD" value="50" min="1" max="300" style="border-color:#34d399;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer" style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-secondary" onclick="closeCreatureModal()">Hủy</button>
                <button type="submit" class="btn-primary" style="background: var(--gold); color: #000; border:none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold;">Lưu thông tin</button>
            </div>
        </form>
    </div>
</div>

<div id="creatureDetailModal" class="modal">
    <div class="modal-content glass-effect" style="max-width: 700px; padding: 0; overflow: hidden; border-radius: 20px;">
        <div id="detailHeader" style="height: 250px; position: relative; background-size: cover; background-position: center;">
            <div style="position: absolute; inset: 0; background: linear-gradient(transparent, rgba(2,6,23,1));"></div>
            <span class="close" onclick="closeCreatureDetailModal()" style="position: absolute; top: 15px; right: 20px; color: white; font-size: 30px; z-index: 10;">&times;</span>
        </div>
        <div style="padding: 30px; position: relative; margin-top: -60px;">
            <div id="detailRank" style="display: inline-block; padding: 5px 15px; background: var(--gold); color: black; border-radius: 20px; font-weight: 800; margin-bottom: 10px;">RANK S</div>
            <h2 id="detailCreatureName" class="cinzel-font" style="font-size: 2.5rem; color: var(--text-main); margin-bottom: 5px;"></h2>
            <div id="detailType" style="color: var(--gold); margin-bottom: 20px; font-weight: 600;"></div>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,0,0,0.2); border-radius: 10px;">
                <div style="text-align: center;">
                    <i class="fa-solid fa-mountain-sun" style="color: #94a3b8; font-size: 1.2rem; margin-bottom: 5px;"></i>
                    <div style="font-size: 0.75rem; color: var(--gold); text-transform: uppercase;">Nơi sống</div>
                    <div id="detailHabitat" style="font-size: 0.9rem; color: #fff;"></div>
                </div>
                <div style="text-align: center;">
                    <i class="fa-solid fa-skull-crossbones" style="color: #ef4444; font-size: 1.2rem; margin-bottom: 5px;"></i>
                    <div style="font-size: 0.75rem; color: var(--gold); text-transform: uppercase;">Điểm yếu</div>
                    <div id="detailWeakness" style="font-size: 0.9rem; color: #fff;"></div>
                </div>
                <div style="text-align: center;">
                    <i class="fa-solid fa-gem" style="color: #3b82f6; font-size: 1.2rem; margin-bottom: 5px;"></i>
                    <div style="font-size: 0.75rem; color: var(--gold); text-transform: uppercase;">Vật phẩm</div>
                    <div id="detailDrops" style="font-size: 0.9rem; color: #fff;"></div>
                </div>
            </div>

            <!-- CHỈ SỐ & ĐẶC TÍNH MỚI TRONG DETAIL -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                <div>
                    <div style="color: var(--gold); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px;"><i class="fa-solid fa-chart-bar"></i> Chỉ Số Chiến Đấu</div>
                    
                    <div class="stat-row" style="margin-bottom: 8px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-bottom:2px;"><span style="color:#f87171;">HP</span><span id="dtHPVal">0</span></div>
                        <div style="height:6px; background:#333; border-radius:3px; overflow:hidden;"><div id="dtHPBar" style="height:100%; background:#ef4444; width:0%; transition: width 1s;"></div></div>
                    </div>
                    <div class="stat-row" style="margin-bottom: 8px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-bottom:2px;"><span style="color:#fb923c;">ATK</span><span id="dtATKVal">0</span></div>
                        <div style="height:6px; background:#333; border-radius:3px; overflow:hidden;"><div id="dtATKBar" style="height:100%; background:#f97316; width:0%; transition: width 1s;"></div></div>
                    </div>
                    <div class="stat-row" style="margin-bottom: 8px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-bottom:2px;"><span style="color:#60a5fa;">DEF</span><span id="dtDEFVal">0</span></div>
                        <div style="height:6px; background:#333; border-radius:3px; overflow:hidden;"><div id="dtDEFBar" style="height:100%; background:#3b82f6; width:0%; transition: width 1s;"></div></div>
                    </div>
                    <div class="stat-row" style="margin-bottom: 8px;">
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-bottom:2px;"><span style="color:#34d399;">SPD</span><span id="dtSPDVal">0</span></div>
                        <div style="height:6px; background:#333; border-radius:3px; overflow:hidden;"><div id="dtSPDBar" style="height:100%; background:#10b981; width:0%; transition: width 1s;"></div></div>
                    </div>
                </div>
                <div>
                    <div style="color: var(--gold); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 10px;"><i class="fa-solid fa-fire-flame-curved"></i> Đặc Tính</div>
                    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                        <div style="font-size: 0.7rem; color: #94a3b8;">Kỹ năng Độc Tôn:</div>
                        <div id="detailSkill" style="color: #f1f5f9; font-weight: 600; font-size: 0.85rem;">Không có</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                        <div style="font-size: 0.7rem; color: #94a3b8;">Tiến Hóa:</div>
                        <div id="detailEvolution" style="color: #d4af37; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-decoration: underline;">Không có dạng kế tiếp</div>
                    </div>
                    <div id="detailTameable" style="display: inline-block; padding: 4px 10px; background: rgba(16,185,129,0.2); color: #10b981; border-radius: 12px; font-size: 0.75rem; font-weight: bold;">
                        Có thể thuần hóa
                    </div>
                </div>
            </div>

            <div id="detailCreatureDesc" style="line-height: 1.8; color: var(--text-dim); text-align: justify; border-top: 1px solid var(--border); padding-top: 20px;"></div>
        </div>
    </div>
</div>

<script src="imageDB.js"></script>
<script src="creatures.js"></script>
</body>
</html>
