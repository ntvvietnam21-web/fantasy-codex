<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Codex - Timeline Book</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="timeline.css">
</head>

<body>
    <div class="header-section">
        <h1>📜 Sử Ký Thế Giới</h1>
        <div class="toolbar">
            <button class="btn-home" onclick="window.location.href='index.html'" title="Về trang chủ"><i class="fa-solid fa-house"></i></button>
            <button class="btn-add" onclick="openAddForm()"><i class="fa-solid fa-feather-pointed"></i> Viết Sử Thi Mới</button>
        </div>
    </div>

    <!-- Book Container -->
    <div class="book-viewport">
        <button id="prevPageBtn" class="flip-btn prev-btn" onclick="prevPage()"><i class="fa-solid fa-chevron-left"></i></button>
        
        <div id="book" class="book">
            <!-- Pages injected via JS -->
        </div>
        
        <button id="nextPageBtn" class="flip-btn next-btn" onclick="nextPage()"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <!-- Modal Form Thêm/Sửa Sự kiện -->
    <div id="formModal" class="modal hidden">
        <div class="modal-content form-content">
            <span class="close-btn" onclick="closeFormModal()">×</span>
            <h2 id="formTitleText" style="margin-top: 0; color: var(--gold); font-family: 'Cinzel', serif;">Khắc ghi Sử Sách</h2>
            
            <div class="form-grid">
                <input type="text" id="eventTitle" placeholder="Tên sự kiện quan trọng..." required>
                
                <div style="display:flex; gap:10px;">
                    <input type="number" id="eventYear" placeholder="Năm (vd: 1023)" style="flex:1;" required>
                    <input type="text" id="eventEra" placeholder="Kỷ nguyên (VD: Kỷ Ánh Sáng)" style="flex:1;">
                </div>

                <div style="display:flex; gap:10px;">
                    <select id="eventType" style="flex:1; cursor: pointer;">
                        <option value="general">📜 Chung</option>
                        <option value="war">⚔️ Chiến tranh</option>
                        <option value="magic">✨ Ma thuật</option>
                        <option value="discovery">🧭 Khám phá</option>
                        <option value="disaster">🌋 Tai ương</option>
                        <option value="birth">👼 Sinh ra / Lập quốc</option>
                        <option value="death">💀 Mất đi / Diệt vong</option>
                    </select>
                    <input type="file" id="eventImage" accept="image/*" style="flex:1; background:rgba(0,0,0,0.3); color:#fff; padding:8px;">
                </div>
                
                <textarea id="eventDesc" placeholder="Mô tả chi tiết về sự kiện... (Hỗ trợ Markdown)" rows="6"></textarea>
                
                <button type="button" class="btn-save" onclick="addEvent()">
                    <i class="fa-solid fa-check"></i> Lưu Lại
                </button>
            </div>
        </div>
    </div>

    <script src="imageDB.js"></script>
    <script src="toast.js"></script>
    <script src="app.js"></script> <!-- To get renderMarkdown if available -->
    <script src="timeline.js"></script>
</body>
</html>
